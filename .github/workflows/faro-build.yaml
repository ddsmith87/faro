# Faro test builds — runs on every push to main, or manually from the Actions tab.
# Produces two downloadable artifacts:
#   faro-android-apk  → install on Android phones (sideload)
#   faro-web          → upload to the server's ./web folder (the installable PWA)
# iOS builds need a Mac + Apple developer account; see FARO.md.

name: Faro build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Generate Faro icons
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: faro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - name: Build web
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --base-href "/"
      - uses: actions/upload-artifact@v4
        with:
          name: faro-web
          path: build/web
