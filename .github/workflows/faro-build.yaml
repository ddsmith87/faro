# Faro test builds — runs on every push to main, or manually from the Actions tab.
# Produces two downloadable artifacts:
#   faro-android-apk  → install on Android phones (sideload)
#   faro-web          → upload to the server's ./web folder (the installable PWA)
# iOS builds need a Mac + Apple developer account; see FARO.md.

name: Faro build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Generate Faro icons
        run: dart run flutter_launcher_icons
      - name: Use Faro signing key (if repo secrets are set)
        env:
          FARO_KEYSTORE_B64: ${{ secrets.FARO_KEYSTORE_B64 }}
          FARO_KEYSTORE_PASS: ${{ secrets.FARO_KEYSTORE_PASS }}
        run: |
          if [ -n "$FARO_KEYSTORE_B64" ]; then
            echo "$FARO_KEYSTORE_B64" | base64 --decode > android/faro-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=faro\nstoreFile=../faro-release.jks\n' \
              "$FARO_KEYSTORE_PASS" "$FARO_KEYSTORE_PASS" > android/key.properties
            echo "Signing with the Faro release key"
          else
            echo "No signing secrets set: using the debug key (fine for testing)"
          fi
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: faro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly && rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
      - run: flutter pub get
      - name: Prepare web
        run: ./scripts/prepare-web.sh
      - run: rm -f ./assets/vodozemac/.gitignore
      - name: Build web
        run: flutter build web --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/ --release --base-href "/"
      - uses: actions/upload-artifact@v7
        with:
          name: faro-web
          path: build/web
